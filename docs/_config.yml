title: Flex Launcher
description: A customizable HTPC application launcher and front-end interface
url: "" # the base hostname & protocol for your site, e.g. http://example.com
github_username: complexlogic
repository: complexlogic/flex-launcher
launcher_version: 2.2

# Build settings
remote_theme: pages-themes/slate@v0.2.0
plugins:
  - jekyll-feed
  - jekyll-remote-theme
  - jekyll-seo-tag

# Jekyll 3 (GitHub Pages) replaces its default exclude list with this one, so the defaults are repeated
exclude:
  - superpowers  # internal design notes, not part of the site
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
